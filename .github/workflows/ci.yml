name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Install, lint and test come from the fleet's shared reusable rather than a
  # local copy, so a change to the house Python gate reaches this repo the same
  # way it reaches every other caller. Pinned to the SHA the rest of the fleet
  # already uses, not to infra-public's HEAD -- a second pin would mean this
  # repo silently gets a different gate from its siblings, which is the whole
  # failure the shared workflow exists to prevent.
  #
  # `install-cmd` overrides the reusable's `uv sync --frozen` default: --locked
  # additionally ASSERTS the lockfile is current, so a stale lock fails here
  # instead of being silently tolerated.
  test:
    uses: quadseven/infra-public/.github/workflows/check.python.yml@cd83e5727c0a7b904f780960664a51b3a3a0c685
    with:
      install-cmd: "uv sync --locked"
      test-cmd: "uv run pytest -q"
      ruff: true

  # DELIBERATELY NOT in the shared reusable. The scan is specific to this repo
  # being publishable, its terms file is local-only, and folding it into the
  # house Python gate would make every caller pay for a check that means
  # nothing to them.
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leak scan
        # Positive control first: if a pattern stops matching its own control
        # the scan reports clean for the wrong reason, which is worse than
        # not scanning at all.
        #
        # WHAT THIS STEP CANNOT SEE. `tools/leakscan.local.txt` is gitignored,
        # so the runner has no local terms and this scan covers only the
        # BUILT-IN topology patterns -- private addresses, cluster naming,
        # username-bearing paths. A bare product name or host nickname passes
        # here every time. That is deliberate on both counts: the terms are not
        # published with the scanner, and on a public repo the workflow log is
        # public, so a finding would print the term it exists to protect.
        #
        # Nickname coverage is therefore a LOCAL pre-publish gate, run with the
        # terms file present, and this step is not evidence of it. The selftest
        # line reports how many classes fired -- 19 without local terms, more
        # with them -- which is the number that tells you which mode ran.
        run: |
          python3 tools/leakscan.py --selftest
          python3 tools/leakscan.py .
