[lint]
command = uv run ruff check .
workflow = quadseven/infra-public/.github/workflows/check.python.yml
step = Lint

[format]
command = uv run ruff format --check .
workflow = quadseven/infra-public/.github/workflows/check.python.yml
step = Format

[type]
command = uv run ty check
workflow = quadseven/infra-public/.github/workflows/check.python.yml
step = Type check

[test]
command = uv run pytest -q
workflow = .github/workflows/ci.yml
step = test job input test-cmd
