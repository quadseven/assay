# Lane validation contract (assay#54): the checks pull-request CI runs, in
# lint, format, type, test order. Every command comes from
# .github/workflows/ci.yml, job `test`, which calls the shared Python check
# reusable with ruff-version and test-cmd; the step names are that
# reusable's. CI runs no type checker, so there is no type entry.
# tests/test_validation_contract.py keeps this file in step with ci.yml.

[lint]
command = uvx ruff@0.15.10 check .
workflow = .github/workflows/ci.yml
step = Ruff check + format --check

[format]
command = uvx ruff@0.15.10 format --check .
workflow = .github/workflows/ci.yml
step = Ruff check + format --check

[test]
command = uv run pytest -q
workflow = .github/workflows/ci.yml
step = Test
